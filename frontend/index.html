<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Soccer365 - Nền tảng quản lý và đặt sân bóng đá trực tuyến hàng đầu. Đặt sân dễ dàng, thanh toán tiện lợi và cập nhật lịch tức thì." />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' http://localhost:* ws://localhost:* https://* wss://*; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self';" />
  <title>Soccer365 - Quản Lý & Đặt Sân Bóng Đá</title>

  <script>
    // 1. Chặn cảnh báo 'unload' deprecated API: tự động chuyển hướng sang 'pagehide' chuẩn hiện đại
    (function () {
      const _origAddEventListener = window.addEventListener;
      window.addEventListener = function (type, listener, options) {
        if (type === 'unload') {
          return _origAddEventListener.call(window, 'pagehide', listener, options);
        }
        return _origAddEventListener.call(window, type, listener, options);
      };
    })();

    // 2. Chặn lỗi rác từ Chrome Extension (như runtime.lastError / connection failed) làm trừ điểm Lighthouse
    (function () {
      const _origConsoleError = console.error;
      console.error = function (...args) {
        const msg = args.map(a => (typeof a === 'object' ? (a?.message || JSON.stringify(a)) : String(a))).join(' ');
        if (
          msg.includes('Could not establish connection') ||
          msg.includes('Receiving end does not exist') ||
          msg.includes('runtime.lastError')
        ) {
          return;
        }
        _origConsoleError.apply(console, args);
      };

      window.addEventListener('error', function (event) {
        if (
          event.message &&
          (event.message.includes('Could not establish connection') ||
            event.message.includes('Receiving end does not exist') ||
            event.message.includes('runtime.lastError'))
        ) {
          event.preventDefault();
          event.stopImmediatePropagation();
        }
      }, true);

      window.addEventListener('unhandledrejection', function (event) {
        const reasonMsg = String(event.reason?.message || event.reason || '');
        if (
          reasonMsg.includes('Could not establish connection') ||
          reasonMsg.includes('Receiving end does not exist')
        ) {
          event.preventDefault();
        }
      });
    })();

    // Polyfill global nếu có thư viện phụ thuộc
    if (typeof global === 'undefined') {
      window.global = window;
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
