services:

  postgres:
    image: postgres:16
    container_name: fpms-postgres
    environment:
      POSTGRES_DB: fpms
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Son@2005"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: fpms-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data: