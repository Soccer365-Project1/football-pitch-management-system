spring.application.name=backend

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/fpms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:1}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JWT Configuration
jwt.secret=9a4f2c8d3e7b1a5f6c8d2e4a7b9c1d3f5a7b9c1d3f5a7b9c1d3f5a7b9c1d3f5a
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Google OAuth2 Configuration
google.client-id=${GOOGLE_CLIENT_ID:1032558823852-is8rsjbfg1ckpntdajo7emphtpnstha0.apps.googleusercontent.com}

# ==========================================
# Email Service Configuration (Brevo SMTP)
# ==========================================
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

app.mail.from-email=${MAIL_FROM_EMAIL}
app.mail.from-name=Soccer365 Football Pitch System

# OTP Configuration
app.auth.otp-expiration-minutes=10
app.auth.otp-cooldown-seconds=60

