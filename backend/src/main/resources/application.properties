spring.application.name=backend

# Import file cấu hình cục bộ (nếu tồn tại, file này được gitignore để bảo mật secret key)
spring.config.import=optional:classpath:application-local.properties

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/fpms}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=9a4f2c8d3e7b1a5f6c8d2e4a7b9c1d3f5a7b9c1d3f5a7b9c1d3f5a7b9c1d3f5a
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Google OAuth2 Configuration
google.client-id=${GOOGLE_CLIENT_ID:1032558823852-is8rsjbfg1ckpntdajo7emphtpnstha0.apps.googleusercontent.com}

# ==========================================
# Email Service Configuration (Brevo REST API - HTTPS 443)
# ==========================================
brevo.api.key=${BREVO_API_KEY:}
brevo.api.url=${BREVO_API_URL:https://api.brevo.com/v3/smtp/email}

app.mail.from-email=${MAIL_FROM_EMAIL:giapit02012005@gmail.com}
app.mail.from-name=${MAIL_FROM_NAME:Soccer365 Football Pitch System}

# OTP Configuration
app.auth.otp-expiration-minutes=10
app.auth.otp-cooldown-seconds=60

# ==========================================
# SpringDoc OpenAPI / Swagger UI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.display-request-duration=true

# ==========================================
# Redis Configuration (Docker: football-redis)
# ==========================================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5000ms

# ==========================================
# Cấu hình Cổng thanh toán VNPAY (Sandbox)
# ==========================================
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:5173/payment-result}
vnpay.version=2.1.0
vnpay.command=pay


