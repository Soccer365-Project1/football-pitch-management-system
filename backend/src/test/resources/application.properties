spring.application.name=backend-test

# ==========================================
# PostgreSQL Database Test Configuration (DB fpms_test riêng biệt)
# ==========================================
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5433/fpms_test}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Server Configuration
server.port=${PORT:8080}

# JWT Configuration
jwt.secret=9a4f2c8d3e7b1a5f6c8d2e4a7b9c1d3f5a7b9c1d3f5a7b9c1d3f5a7b9c1d3f5a
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# Google OAuth2 Mock/Test Configuration
google.client-id=mock-google-client-id-for-testing.apps.googleusercontent.com

# Brevo Email Configuration
brevo.api.key=mock-brevo-api-key
brevo.api.url=https://api.brevo.com/v3/smtp/email
app.mail.from-email=test@soccer365.vn
app.mail.from-name=Soccer365 Football Pitch System

# OTP Configuration
app.auth.otp-expiration-minutes=10
app.auth.otp-cooldown-seconds=60

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=5000ms
